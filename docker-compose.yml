# Reference deployment for the Vestigo backing services (Postgres, ClickHouse, Qdrant).
# Vestigo itself is a native Python/uv app and runs directly on the host (see README
# "Quick start"); uncomment the `app` service below for a containerized all-in-one instead.
#
# All published ports are bound to 127.0.0.1 on purpose: these services run with default or
# no credentials, so exposing them beyond loopback would let anyone with network reach bypass
# the app-layer RBAC entirely. To expose a service on the LAN, change its bind address AND
# set real credentials (e.g. the commented QDRANT__SERVICE__API_KEY below, a real
# POSTGRES_PASSWORD, and a ClickHouse user/password).
#
# MEMORY LIMITS are set, sized for a 32 GiB host, and overridable per service via the
# VESTIGO_*_MEM_LIMIT variables below. They used to ship commented out, which is how a
# production instance ran for months with nothing bounding ClickHouse at all: with no
# container limit it derived its own ceiling from 0.9 x the RAM it *detected* — the whole
# host — grew past what was actually free, and was SIGKILLed (`exited with code 137`)
# with no ClickHouse-side memory error anywhere in its log. A guardrail nobody enables is
# not a guardrail. Raise them to fit your box; do not remove them.
#
# The container limit is only half of it: it decides who the kernel kills, not whether
# ClickHouse throttles itself first. `deploy/clickhouse/memory.xml` (mounted below) is
# what does that, and it is also the only layer that bounds background merges — which no
# per-query cap can reach. Keep the two in step: server ceiling below container limit.
#
# The app derives its own VESTIGO_STAT_SCAN_* budget from whatever ClickHouse reports,
# so these numbers move the whole stack. `/api/health` reports what actually resolved.
# See docs/DEPLOYMENT.md "Resource sizing".

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: vestigo
      POSTGRES_PASSWORD: vestigo
      POSTGRES_DB: vestigo
      # `trust` by default, matching what ClickHouse and Qdrant already do in
      # this file: it is published on 127.0.0.1 only and ships well-known
      # credentials by design (see DEPLOYMENT.md "Reference compose stack").
      # It is also worth real time — asyncpg computes SCRAM's PBKDF2 in pure
      # Python, ~20 ms per connection, and the test suite's API tests open a
      # connection per database operation. Set VESTIGO_POSTGRES_HOST_AUTH to
      # scram-sha-256 to keep password auth.
      #
      # Applies at initdb only: an existing `postgres_data` volume keeps the
      # method it was created with, so this changes nothing until the volume is
      # recreated (`podman compose down -v` — destroys local dev data).
      POSTGRES_HOST_AUTH_METHOD: ${VESTIGO_POSTGRES_HOST_AUTH:-trust}
    ports:
      - "127.0.0.1:5432:5432"
    # Metadata only — never holds events.
    mem_limit: ${VESTIGO_POSTGRES_MEM_LIMIT:-4g}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vestigo -d vestigo"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    # Pinned to an exact build for forensic reproducibility. >= 25.4 brings
    # lazy materialization (query_plan_optimize_lazy_materialization, default
    # on since 25.5), which keeps any remaining full-row ORDER BY ... LIMIT
    # query cheap server-side.
    image: docker.io/clickhouse/clickhouse-server:26.6.1.1193-alpine
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    # Where query cost actually lives, and the service the kernel kills first.
    # 12g suits a 32 GiB host running the whole stack. A cgroup limit alone is
    # not enough — it is paired with the memory.xml drop-in below, because a
    # containerized ClickHouse can misdetect total RAM when deriving its own
    # 90%-of-RAM server limit, and would then never self-throttle.
    # memswap_limit pins swap off: a swapping ClickHouse is worse than a
    # failing one.
    mem_limit: ${VESTIGO_CLICKHOUSE_MEM_LIMIT:-12g}
    memswap_limit: ${VESTIGO_CLICKHOUSE_MEM_LIMIT:-12g}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # >= 25.x images restrict the `default` user to localhost — see the
      # comment in the mounted file.
      # (`z` = SELinux relabel for rootless podman on Fedora; harmless on Docker)
      - ./deploy/clickhouse/allow-default-network.xml:/etc/clickhouse-server/users.d/zz-allow-default-network.xml:ro,z
      # Server-side memory ceiling — the layer that makes ClickHouse fail one
      # query instead of being killed, and the only one that bounds merges.
      # Sized to sit under mem_limit above; edit both together.
      - ./deploy/clickhouse/memory.xml:/etc/clickhouse-server/config.d/zz-memory.xml:ro,z
    healthcheck:
      # clickhouse-client is bundled in the image and always present, unlike
      # wget/curl which vary across the alpine base and gave false negatives.
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  qdrant:
    image: docker.io/qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
    # Only used when embeddings are enabled; memory scales with vector count.
    mem_limit: ${VESTIGO_QDRANT_MEM_LIMIT:-4g}
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Disable Qdrant's anonymized usage telemetry — Vestigo is offline-by-default
      # (docs/TECH_STACK.md §6) and this backing service must not phone home.
      QDRANT__TELEMETRY_DISABLED: "true"
      # Uncomment to require an API key (must match VESTIGO_QDRANT_API_KEY on `app`):
      # QDRANT__SERVICE__API_KEY: change-me
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 5

