# Airgapped deployment: the same stack as the repository's docker-compose.yml,
# with every image pre-loaded from the bundle and nothing built on the host.
#
# `image:` everywhere and no `build:` anywhere is the point — a build would need
# a registry. `install.sh` loads the images from `images/` before calling this.
#
# The backing services publish NO host ports: the app reaches them over the
# compose network, so exposing them would only add an attack surface (they run
# with default credentials) and a port conflict with whatever else the host
# runs. Only the app is published — put TLS in front of it (nginx-tls.conf).
# To inspect a service directly, use `compose exec`, or add a port yourself.
#
# `name:` is pinned so the project — and therefore the named volumes holding all
# case data — does not depend on the directory this file happens to sit in. An
# upgrade extracts a *new* bundle directory; without this, compose would derive
# a new project name from it and bring up an empty stack next to the old data.
# Set COMPOSE_PROJECT_NAME in .env to adopt an install that used another name.

# MEMORY LIMITS are set below, sized for a 32 GiB host and overridable per service
# via the VESTIGO_*_MEM_LIMIT variables in .env. They were missing entirely from this
# file until 1.15 — the repository's own docker-compose.yml at least carried them
# commented out, but *this* is the file that reaches production, and it shipped with
# nothing bounding any service. With no container limit ClickHouse derives its own
# ceiling from 0.9 x the RAM it detects, which in an unlimited container is the whole
# host, shared with three other services; it grows past what is free and the kernel
# SIGKILLs it (`exited with code 137`) leaving no memory error in ClickHouse's log,
# and `restart: unless-stopped` brings it straight back. Raise these to fit your box;
# do not remove them. See docs/DEPLOYMENT.md "Resource sizing".

name: vestigo

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    # Metadata only — never holds events.
    mem_limit: ${VESTIGO_POSTGRES_MEM_LIMIT:-4g}
    environment:
      POSTGRES_USER: vestigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vestigo}
      POSTGRES_DB: vestigo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vestigo -d vestigo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.6.1.1193-alpine
    # The service that holds every event, and the one the kernel kills first.
    # memswap_limit pins swap off: a swapping ClickHouse is worse than a
    # failing one.
    mem_limit: ${VESTIGO_CLICKHOUSE_MEM_LIMIT:-12g}
    memswap_limit: ${VESTIGO_CLICKHOUSE_MEM_LIMIT:-12g}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/allow-default-network.xml:/etc/clickhouse-server/users.d/zz-allow-default-network.xml:ro,z
      # Server-side ceiling. The cgroup limit above only decides who the kernel
      # kills; this decides whether ClickHouse throttles itself first, and it is
      # the only layer that bounds background merges — which no per-query cap
      # reaches. Keep it under mem_limit and edit the two together.
      - ./clickhouse/memory.xml:/etc/clickhouse-server/config.d/zz-memory.xml:ro,z
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  qdrant:
    image: docker.io/qdrant/qdrant:v1.18.2
    # Only carries weight when embeddings are enabled; scales with vector count.
    mem_limit: ${VESTIGO_QDRANT_MEM_LIMIT:-4g}
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # Tag written by scripts/airgap-bundle.sh and recorded in the bundle's
    # .env — an upgrade is: load the new image, bump this, `up -d`.
    #
    # `localhost/` is not decoration. Podman stores a locally built, unqualified
    # image as `localhost/vestigo-app:TAG` and writes that name into the archive;
    # docker `load` keeps it verbatim but resolves a *bare* `vestigo-app:TAG` to
    # `docker.io/library/vestigo-app` — so a podman-built bundle installed on a
    # docker host looked like "missing image(s) after load" for an image the log
    # had just said it loaded. Podman resolves the same short name to
    # `localhost/`, which is why only docker hosts saw it. Writing the name fully
    # qualified makes both engines agree, and nothing ever pulls it.
    image: localhost/vestigo-app:${VESTIGO_IMAGE_TAG:?set VESTIGO_IMAGE_TAG in .env}
    # Ingestion batches, export buffering and any converter subprocess live
    # here. A converter that outgrows this is killed inside the container
    # rather than taking the host down, which is the intended trade — keep
    # VESTIGO_CONVERTER_RUN_MEMORY_MB under it so the guarded runner reports
    # the failure itself instead.
    mem_limit: ${VESTIGO_APP_MEM_LIMIT:-4g}
    ports:
      - "${VESTIGO_BIND:-0.0.0.0}:${VESTIGO_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Connection settings point at the compose network, so they are fixed
      # here rather than left to the .env an operator edits.
      VESTIGO_POSTGRES_URL: postgresql+asyncpg://vestigo:${POSTGRES_PASSWORD:-vestigo}@postgres:5432/vestigo
      VESTIGO_CLICKHOUSE_URL: http://clickhouse:8123
      VESTIGO_QDRANT_URL: http://qdrant:6333
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  qdrant_data:
  app_data:
